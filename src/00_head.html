<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Counter-Strife 2</title>
<meta name="description" content="A free browser tactical shooter: bomb defusal, economy, hard bots and online play.">
<style>
/*FONTS*/
:root{
  --bg0:#0a0d12; --bg1:#10151d; --panel:rgba(14,18,25,.84); --panel2:rgba(24,30,41,.92); --panel3:rgba(36,44,58,.95);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --txt:#e9edf2; --dim:#8e98a8; --dim2:#5d6676;
  --ct:#7b9ad6; --ctd:#3f5a8f; --t:#e5a43f; --td:#8f6420;
  --go:#5bb248; --go2:#469a35; --bad:#e2463f; --gold:#f4c95d; --cash:#8fd16a;
  --f:'Barlow',system-ui,'Segoe UI',Arial,sans-serif; --fc:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0);color:var(--txt);font-family:var(--f);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#app>canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.icon{width:1em;height:1em;display:inline-block;vertical-align:-.12em;fill:currentColor}

/* ---------- loading ---------- */
#loading{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(120% 90% at 50% 40%,#18202c 0%,#0a0d12 70%)}
.logo{font-family:var(--fc);font-weight:700;letter-spacing:.06em;line-height:.9;text-transform:uppercase;text-align:left}
.logo .l1{display:block;font-size:64px}
.logo .l2{display:flex;align-items:center;gap:12px;font-size:64px}
.logo .two{display:inline-grid;place-items:center;width:.95em;height:.95em;background:var(--t);color:#111;border-radius:6px;font-size:.8em}
.logo small{display:block;font-family:var(--f);font-weight:500;font-size:13px;letter-spacing:.35em;color:var(--dim);margin-top:10px}
#loadbar{width:min(420px,70vw);height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
#loadbar>i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left center;background:linear-gradient(90deg,var(--t),var(--gold));transition:transform .15s}
#loadtxt{font-size:13px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;min-height:1.2em}

/* ---------- menu ---------- */
#menu{position:absolute;inset:0;z-index:30;display:flex;pointer-events:auto}
#menu::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,11,16,.94) 0%,rgba(8,11,16,.82) 45%,rgba(8,11,16,.35) 72%,rgba(8,11,16,.2) 100%);pointer-events:none}
#menu .side{position:relative;width:300px;padding:44px 34px;display:flex;flex-direction:column;gap:6px;flex:none}
#menu .side .logo{margin-bottom:34px}
#menu .side .logo .l1,#menu .side .logo .l2{font-size:40px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;padding:11px 14px;font-family:var(--fc);font-weight:600;font-size:21px;letter-spacing:.08em;text-transform:uppercase;color:#c9d0da;border-left:3px solid transparent;transition:background .15s,color .15s,border-color .15s}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{color:#fff;border-left-color:var(--t);background:linear-gradient(90deg,rgba(229,164,63,.16),transparent)}
.side .foot{margin-top:auto;font-size:12px;color:var(--dim2);line-height:1.6}
#menu .main{position:relative;flex:1;min-width:0;padding:44px 44px 36px 10px;overflow:auto}
.pane{max-width:900px;animation:paneIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pane h2{font-family:var(--fc);font-weight:700;font-size:34px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.pane .sub{color:var(--dim);font-size:14px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;backdrop-filter:blur(8px)}
.grid{display:grid;gap:10px}
.modes{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.mode{position:relative;text-align:left;padding:16px 16px 14px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);min-height:112px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s,background .15s}
.mode:hover{border-color:var(--line2);transform:translateY(-2px)}
.mode.on{border-color:var(--t);background:linear-gradient(160deg,rgba(229,164,63,.18),var(--panel2) 60%)}
.mode b{font-family:var(--fc);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.mode span{font-size:12.5px;color:var(--dim);line-height:1.35}
.mode em{position:absolute;top:10px;right:12px;font-style:normal;font-size:11px;color:var(--dim2);font-family:var(--fc);letter-spacing:.1em}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.opt{display:flex;flex-direction:column;gap:7px;margin-top:18px}
.opt>label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.seg{display:inline-flex;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:5px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:3px;font-family:var(--fc);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#aeb7c4}
.seg button:hover{color:#fff;background:rgba(255,255,255,.05)}
.seg button.on{background:var(--panel3);color:#fff;box-shadow:inset 0 -2px 0 var(--t)}
.seg button.ct.on{box-shadow:inset 0 -2px 0 var(--ct)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 22px;border-radius:5px;font-family:var(--fc);font-weight:700;font-size:18px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel3);border:1px solid var(--line2);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(1px)}
.btn.go{background:linear-gradient(180deg,var(--go),var(--go2));border-color:rgba(255,255,255,.18);color:#fff;min-width:180px;padding:14px 30px;font-size:22px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.btn.small{padding:8px 14px;font-size:14px}
.btn.danger{background:rgba(226,70,63,.18);border-color:rgba(226,70,63,.45)}
.gobar{display:flex;align-items:center;gap:18px;margin-top:26px}
.gobar .note{color:var(--dim);font-size:13px;line-height:1.5}
.tfield{background:rgba(0,0,0,.4);border:1px solid var(--line2);border-radius:4px;padding:10px 12px;font-size:16px;outline:none;min-width:220px;-webkit-user-select:text;user-select:text}
.tfield:focus{border-color:var(--t)}
.code{font-family:var(--fc);font-weight:700;font-size:40px;letter-spacing:.3em;color:var(--gold)}
.slist{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.slist .pl{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(255,255,255,.03);border-radius:4px;font-size:14px}
.slist .pl i{width:8px;height:8px;border-radius:50%;background:var(--dim2)}
.slist .pl.ct i{background:var(--ct)} .slist .pl.t i{background:var(--t)}
.slist .pl small{margin-left:auto;color:var(--dim);font-size:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.status{font-size:13px;color:var(--dim);margin-top:10px;min-height:1.3em}
.status.err{color:var(--bad)}
.status.ok{color:var(--cash)}
/* settings */
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:8px 16px;font-family:var(--fc);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--t)}
.set{display:grid;grid-template-columns:220px 1fr auto;align-items:center;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line)}
.set>span{font-size:14px;color:#cfd5de}
.set>output{font-family:var(--fc);font-size:16px;min-width:52px;text-align:right;color:var(--gold)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:rgba(255,255,255,.12);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--t);cursor:pointer;border:2px solid #111}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--t);cursor:pointer;border:2px solid #111}
.keybtn{min-width:120px;padding:7px 12px;border-radius:4px;background:rgba(0,0,0,.4);border:1px solid var(--line2);font-family:var(--fc);font-weight:600;letter-spacing:.06em}
.keybtn.wait{border-color:var(--t);color:var(--t)}
.xhprev{width:120px;height:120px;border-radius:6px;background:linear-gradient(135deg,#7d6a4f,#b99c72 50%,#5d6f86);border:1px solid var(--line2)}
.help{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.help .card h4{font-family:var(--fc);font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;color:var(--gold)}
.help .card p,.help .card li{font-size:13.5px;color:#c6cdd7;line-height:1.55}
.help .card ul{padding-left:18px}
kbd{display:inline-block;padding:1px 6px;border-radius:3px;border:1px solid var(--line2);background:rgba(0,0,0,.4);font-family:var(--fc);font-size:13px;color:#fff}
/* inventory */
.inv{display:grid;grid-template-columns:260px 1fr;gap:14px}
.wlist{display:flex;flex-direction:column;gap:3px;max-height:62vh;overflow:auto;padding-right:4px}
.wlist button{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:4px;text-align:left;font-size:14px;color:#c9d0da}
.wlist button img{width:64px;height:24px;object-fit:contain}
.wlist button:hover{background:rgba(255,255,255,.05)}
.wlist button.on{background:rgba(229,164,63,.16);color:#fff}
.wlist h5{font-size:11px;letter-spacing:.18em;color:var(--dim2);margin:10px 4px 2px;text-transform:uppercase}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.skin{border-radius:5px;background:var(--panel2);border:1px solid var(--line);padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
.skin:hover{border-color:var(--line2)}
.skin.on{border-color:var(--gold)}
.skin img{width:100%;height:70px;object-fit:contain}
.skin b{font-size:13px;font-weight:600}
.skin span{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.r0{color:#b0c3d9}.r1{color:#5e98d9}.r2{color:#4b69ff}.r3{color:#8847ff}.r4{color:#d32ce6}.r5{color:#eb4b4b}.r6{color:#e4ae39}
.free{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:3px;background:rgba(91,178,72,.2);color:var(--cash);font-size:12px;letter-spacing:.1em;font-family:var(--fc)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none;font-family:var(--fc)}
#hud .shadow{text-shadow:0 1px 2px rgba(0,0,0,.8)}
#xhair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#topbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:3px}
#topbar .tm{display:flex;gap:3px;align-items:center}
#topbar .pip{width:26px;height:34px;border-radius:3px;background:rgba(10,13,18,.72);position:relative;overflow:hidden}
#topbar .pip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:currentColor}
#topbar .pip.dead{opacity:.28}
#topbar .pip.ct{color:var(--ct)} #topbar .pip.t{color:var(--t)}
#topbar .pip b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:#fff;font-weight:600}
#topbar .sc{min-width:46px;display:grid;place-items:center;font-weight:700;font-size:26px;background:rgba(10,13,18,.78);border-radius:3px;padding:0 8px}
#topbar .sc.ct{color:var(--ct)} #topbar .sc.t{color:var(--t)}
#topbar .clock{min-width:84px;display:grid;place-items:center;font-weight:600;font-size:24px;background:rgba(10,13,18,.85);border-radius:3px;padding:0 10px;letter-spacing:.04em}
#topbar .clock.red{color:var(--bad)}
#topbar .clock svg{width:26px;height:26px;fill:var(--bad);animation:bombPulse 1s infinite}
@keyframes bombPulse{50%{opacity:.4}}
#radarBox{position:absolute;left:14px;top:14px;width:208px}
#radar{width:208px;height:208px;display:block;border-radius:6px;background:rgba(8,10,14,.55);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
#loc{margin-top:5px;font-size:15px;font-weight:600;letter-spacing:.05em;color:#dfe6ee}
#money{margin-top:2px;font-size:26px;font-weight:700;color:var(--cash);display:flex;align-items:center;gap:8px}
#money .gain{font-size:18px;color:var(--cash);opacity:0;transition:opacity .3s}
#money .gain.show{opacity:1}
#buyhint{font-size:13px;color:var(--dim);letter-spacing:.06em;font-family:var(--f)}
#killfeed{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.kf{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:3px;background:rgba(10,13,18,.72);font-size:17px;font-weight:600;animation:kfIn .2s ease-out}
.kf.me{box-shadow:inset 0 0 0 2px #c3312b;background:rgba(40,10,10,.7)}
.kf.dead{background:rgba(60,10,10,.75)}
.kf .ct{color:var(--ct)} .kf .t{color:var(--t)}
.kf img{height:18px;width:auto;filter:brightness(1.3)}
.kf svg{width:18px;height:18px;fill:#fff}
@keyframes kfIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
#vitals{position:absolute;left:18px;bottom:16px;display:flex;align-items:flex-end;gap:22px}
.vital{display:flex;align-items:center;gap:8px;font-size:40px;font-weight:600;line-height:1}
.vital svg{width:26px;height:26px;fill:#fff;opacity:.9}
.vital.low{color:var(--bad)} .vital.low svg{fill:var(--bad)}
.vital .bar{width:84px;height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden;align-self:center}
.vital .bar i{display:block;height:100%;background:#fff}
#kitIcon{font-size:14px;letter-spacing:.1em;color:var(--ct);align-self:center}
#ammo{position:absolute;right:20px;bottom:16px;display:flex;align-items:flex-end;gap:10px;line-height:1}
#ammo .clip{font-size:44px;font-weight:600}
#ammo .clip.low{color:var(--bad)}
#ammo .res{font-size:22px;color:#c9d0da;padding-bottom:4px}
#ammo .wname{position:absolute;right:0;bottom:52px;font-size:15px;letter-spacing:.08em;color:var(--dim);white-space:nowrap}
#wlist{position:absolute;right:18px;bottom:110px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;transition:opacity .4s}
#wlist.fade{opacity:0}
#wlist .w{display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(255,255,255,.55)}
#wlist .w img{height:22px;width:auto;opacity:.55}
#wlist .w.on{color:#fff} #wlist .w.on img{opacity:1;filter:drop-shadow(0 0 4px rgba(255,255,255,.4))}
#wlist .w b{font-weight:600;width:12px;text-align:right}
#center{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center}
#center .big{font-size:44px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#center .big.ct{color:var(--ct)} #center .big.t{color:var(--t)}
#center .small{font-size:18px;color:#dfe5ec;margin-top:4px;letter-spacing:.06em;text-shadow:0 1px 4px #000}
#roundBanner{position:absolute;left:0;right:0;top:18%;display:flex;justify-content:center}
#roundBanner .bn{min-width:min(760px,90vw);padding:18px 30px 16px;text-align:center;background:linear-gradient(90deg,transparent,rgba(10,13,18,.9) 15%,rgba(10,13,18,.9) 85%,transparent);animation:bnIn .35s cubic-bezier(.2,.8,.2,1)}
#roundBanner .bn.ct{border-top:3px solid var(--ct)} #roundBanner .bn.t{border-top:3px solid var(--t)}
#roundBanner h3{font-size:42px;letter-spacing:.07em;text-transform:uppercase}
#roundBanner .ct h3{color:var(--ct)} #roundBanner .t h3{color:var(--t)}
#roundBanner p{font-family:var(--f);font-size:15px;color:#cfd6df;margin-top:4px}
#roundBanner .mvp{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:18px;color:var(--gold)}
#roundBanner .mvp svg{width:20px;height:20px;fill:var(--gold)}
@keyframes bnIn{from{opacity:0;transform:scaleX(.8)}to{opacity:1;transform:none}}
#hint{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);font-family:var(--f);font-size:15px;color:#fff;background:rgba(10,13,18,.7);padding:7px 14px;border-radius:4px;white-space:nowrap}
#prog{position:absolute;left:50%;top:58%;transform:translateX(-50%);width:280px;text-align:center}
#prog .lbl{font-size:16px;letter-spacing:.1em;margin-bottom:6px;text-transform:uppercase}
#prog .bar{height:8px;background:rgba(0,0,0,.6);border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
#prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ct),#b8ccf3)}
#prog.t .bar i{background:linear-gradient(90deg,var(--t),var(--gold))}
#dmgRing{position:absolute;left:50%;top:50%;width:0;height:0}
.dmgArc{position:absolute;left:-90px;top:-90px;width:180px;height:180px;pointer-events:none}
.dmgArc path{fill:none;stroke:rgba(230,40,30,.9);stroke-width:7;stroke-linecap:round}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(180,0,0,.55) 100%);opacity:0;transition:opacity .15s}
#scope{position:absolute;inset:0;display:none}
#scope.on{display:block}
#scope .mask{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 0,transparent calc(min(50vw,50vh) - 2px),#000 calc(min(50vw,50vh) + 1px))}
#scope .lh,#scope .lv{position:absolute;background:#000}
#scope .lh{left:0;right:0;top:50%;height:1px;transform:translateY(-.5px)}
#scope .lv{top:0;bottom:0;left:50%;width:1px;transform:translateX(-.5px)}
#scope .blur{position:absolute;inset:0;box-shadow:inset 0 0 calc(min(50vw,50vh)*.35) rgba(0,0,0,.6);border-radius:50%;left:calc(50% - min(50vw,50vh));top:calc(50% - min(50vw,50vh));width:calc(min(50vw,50vh)*2);height:calc(min(50vw,50vh)*2)}
#flashImg,#flashWhite{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
#flashWhite{background:#fff}
#chat{position:absolute;left:18px;bottom:120px;width:min(460px,50vw);display:flex;flex-direction:column;gap:3px;font-family:var(--f);font-size:14.5px}
#chat .ln{padding:2px 8px;border-radius:3px;background:rgba(0,0,0,.35);text-shadow:0 1px 2px #000;animation:kfIn .2s;line-height:1.35}
#chat .ln.old{opacity:0;transition:opacity 1s}
#chat .ln .ct{color:var(--ct)} #chat .ln .t{color:var(--t)} #chat .ln .sys{color:var(--gold)} #chat .ln .rad{color:#9fd3a1}
#chatIn{position:absolute;left:18px;bottom:88px;width:min(460px,50vw);display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.7);border:1px solid var(--line2);border-radius:4px;padding:6px 10px;pointer-events:auto}
#chatIn span{font-size:13px;color:var(--dim);font-family:var(--f)}
#chatIn input{flex:1;background:none;border:0;outline:none;font-family:var(--f);font-size:15px;-webkit-user-select:text;user-select:text}
#spec{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);text-align:center;background:rgba(10,13,18,.78);padding:8px 26px;border-radius:4px}
#spec b{font-size:22px;letter-spacing:.05em}
#spec small{display:block;font-family:var(--f);font-size:12px;color:var(--dim);margin-top:2px}
#fps{position:absolute;right:8px;top:0;font-size:12px;color:#9f9;font-family:ui-monospace,Consolas,monospace;text-shadow:0 1px 1px #000}
#bombStat{position:absolute;left:14px;top:300px;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--t)}
#bombStat svg{width:22px;height:22px;fill:var(--t)}
#net{position:absolute;right:8px;top:14px;font-size:12px;color:var(--dim);font-family:var(--f)}
/* scoreboard */
#score{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,94vw);background:rgba(10,13,18,.9);border:1px solid var(--line);border-radius:6px;padding:14px 18px;font-family:var(--f);backdrop-filter:blur(6px)}
#score .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:var(--fc)}
#score .hdr b{font-size:22px;letter-spacing:.08em}
#score .hdr span{color:var(--dim);font-size:14px;letter-spacing:.08em}
#score table{width:100%;border-collapse:collapse;font-size:14px}
#score th{font-family:var(--fc);font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--dim);text-align:right;padding:4px 8px;text-transform:uppercase}
#score th:first-child,#score td:first-child{text-align:left}
#score td{padding:5px 8px;text-align:right;border-top:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
#score tr.me td{background:rgba(255,255,255,.07)}
#score tr.dead td{opacity:.45}
#score .tt td:first-child{color:var(--t)} #score .ct td:first-child{color:var(--ct)}
#score .teamhead{display:flex;align-items:center;gap:12px;margin:10px 0 4px;font-family:var(--fc);font-weight:700;font-size:20px;letter-spacing:.06em}
#score .teamhead.ct{color:var(--ct)} #score .teamhead.t{color:var(--t)}
#score .teamhead .n{font-size:28px}
#score .bot{font-size:10px;letter-spacing:.1em;color:var(--dim2);margin-left:6px}
#score .hist{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap}
#score .hist i{width:22px;height:22px;border-radius:2px;display:grid;place-items:center;background:rgba(255,255,255,.05)}
#score .hist i svg{width:14px;height:14px}
#score .hist i.ct svg{fill:var(--ct)} #score .hist i.t svg{fill:var(--t)}
#score .hist i.half{width:3px;background:var(--dim2)}
/* buy menu */
#buy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,10,.45);pointer-events:auto}
#buy .box{width:min(1100px,96vw);max-height:92vh;overflow:auto;background:rgba(12,16,22,.94);border:1px solid var(--line);border-radius:6px;padding:16px 18px;font-family:var(--f)}
#buy .top{display:flex;align-items:center;gap:16px;margin-bottom:12px;font-family:var(--fc)}
#buy .top h3{font-size:26px;letter-spacing:.08em;text-transform:uppercase}
#buy .top .cash{margin-left:auto;font-size:28px;font-weight:700;color:var(--cash)}
#buy .top .tl{font-size:15px;color:var(--dim);letter-spacing:.06em}
#buy .cols{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
#buy .col h4{font-family:var(--fc);font-weight:600;font-size:14px;letter-spacing:.14em;color:var(--dim);margin:0 0 6px 2px;text-transform:uppercase}
#buy .col h4 kbd{margin-right:6px}
#buy .it{position:relative;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px 7px;margin-bottom:6px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);text-align:left;transition:background .1s,border-color .1s}
#buy .it:hover,#buy .it.hov{background:rgba(255,255,255,.1);border-color:var(--line2)}
#buy .it img{height:34px;width:100%;object-fit:contain;object-position:left}
#buy .it .nm{font-size:13.5px;font-weight:600}
#buy .it .pr{position:absolute;right:8px;top:6px;font-family:var(--fc);font-size:15px;color:var(--cash)}
#buy .it .k{position:absolute;right:8px;bottom:6px;font-family:var(--fc);font-size:12px;color:var(--dim2)}
#buy .it.no{opacity:.35}
#buy .it.own{border-color:rgba(143,209,106,.45)}
#buy .it.hl{border-color:rgba(244,201,93,.55)}
#buy .foot{margin-top:10px;display:flex;gap:18px;color:var(--dim);font-size:12.5px}
#vcursor{position:absolute;left:0;top:0;width:18px;height:18px;z-index:40;pointer-events:none;display:none}
#vcursor svg{width:18px;height:18px;filter:drop-shadow(0 1px 1px #000)}
/* team select */
#teamSel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:24px;background:rgba(5,7,10,.72);pointer-events:auto;font-family:var(--fc)}
#teamSel .tcard{width:260px;height:340px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:22px;gap:6px;border:2px solid var(--line);transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
#teamSel .tcard:hover{transform:translateY(-4px)}
#teamSel .tcard.t{background:linear-gradient(180deg,rgba(229,164,63,.05),rgba(229,164,63,.28))}
#teamSel .tcard.ct{background:linear-gradient(180deg,rgba(123,154,214,.05),rgba(123,154,214,.28))}
#teamSel .tcard.t:hover{border-color:var(--t)} #teamSel .tcard.ct:hover{border-color:var(--ct)}
#teamSel .tcard b{font-size:30px;letter-spacing:.08em;text-transform:uppercase}
#teamSel .tcard span{font-family:var(--f);font-size:13px;color:#cfd6df}
#teamSel .tcard svg{position:absolute;top:36px;width:120px;height:120px;opacity:.85}
#teamSel .tcard.t svg{fill:var(--t)} #teamSel .tcard.ct svg{fill:var(--ct)}
#teamSel .tcard.auto{background:rgba(255,255,255,.04);width:180px}
/* pause / overlays */
#pause,#clickplay,#matchEnd,#dialog{position:absolute;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#pause{background:rgba(5,7,10,.62);backdrop-filter:blur(3px)}
#pause .box{width:340px;display:flex;flex-direction:column;gap:8px}
#pause .box .btn{width:100%}
#pause h2{font-family:var(--fc);font-size:34px;letter-spacing:.08em;text-align:center;margin-bottom:10px}
#clickplay{background:rgba(5,7,10,.35);cursor:pointer}
#clickplay div{font-family:var(--fc);font-size:26px;letter-spacing:.12em;text-transform:uppercase;background:rgba(10,13,18,.85);padding:16px 30px;border-radius:5px;border:1px solid var(--line2)}
#clickplay small{display:block;font-family:var(--f);font-size:13px;letter-spacing:.04em;text-transform:none;color:var(--dim);margin-top:6px}
#matchEnd{background:rgba(5,7,10,.8);flex-direction:column;gap:12px;font-family:var(--fc)}
#matchEnd h1{font-size:64px;letter-spacing:.08em;text-transform:uppercase}
#matchEnd h1.ct{color:var(--ct)} #matchEnd h1.t{color:var(--t)}
#matchEnd .fs{font-size:40px;letter-spacing:.1em}
#matchEnd .st{font-family:var(--f);color:#cfd6df;font-size:16px;text-align:center;line-height:1.7}
#dialog{background:rgba(5,7,10,.6)}
#dialog .card{max-width:440px;text-align:center}
#dialog p{margin:6px 0 16px;color:#cfd6df;line-height:1.5}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:rgba(10,13,18,.92);border:1px solid var(--line2);padding:10px 18px;border-radius:5px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:760px){
  #menu{flex-direction:column;overflow:auto}
  #menu .side{width:auto;padding:22px 18px 8px}
  #menu .side .logo{margin-bottom:12px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{font-size:16px;padding:8px 10px;border-left:0;border-bottom:3px solid transparent}
  .nav button.on{border-bottom-color:var(--t)}
  #menu .main{padding:10px 16px 30px}
  .inv,.cols2{grid-template-columns:1fr}
  .set{grid-template-columns:1fr auto;}
  .set>input[type=range],.set>.seg{grid-column:1/-1}
  #buy .cols{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
