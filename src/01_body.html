<body>
<div id="app">
  <canvas id="flashImg"></canvas>
  <div id="flashWhite"></div>

  <div id="hud" class="hidden">
    <div id="scope"><div class="blur"></div><div class="mask"></div><div class="lh"></div><div class="lv"></div></div>
    <div id="vignette"></div>
    <canvas id="xhair" width="160" height="160"></canvas>
    <div id="dmgRing"></div>
    <div id="topbar"></div>
    <div id="radarBox"><canvas id="radar" width="416" height="416"></canvas><div id="loc" class="shadow"></div><div id="money" class="shadow"><span class="v"></span><span class="gain"></span></div><div id="buyhint" class="shadow"></div></div>
    <div id="bombStat" class="shadow hidden"></div>
    <div id="killfeed"></div>
    <div id="center"></div>
    <div id="roundBanner"></div>
    <div id="hint" class="hidden"></div>
    <div id="prog" class="hidden"><div class="lbl"></div><div class="bar"><i></i></div></div>
    <div id="chat"></div>
    <div id="chatIn" class="hidden"><span>Say:</span><input id="chatText" maxlength="120" autocomplete="off"></div>
    <div id="vitals" class="shadow"></div>
    <div id="wlist" class="shadow"></div>
    <div id="ammo" class="shadow"></div>
    <div id="spec" class="hidden"></div>
    <div id="fps" class="hidden"></div>
    <div id="net" class="hidden"></div>
    <div id="score" class="hidden"></div>
    <div id="buy" class="hidden"></div>
    <div id="teamSel" class="hidden"></div>
  </div>

  <div id="menu" class="hidden"></div>
  <div id="pause" class="hidden"></div>
  <div id="clickplay" class="hidden"><div>Click to play<small>Your mouse will be captured. Press Esc for the menu.</small></div></div>
  <div id="matchEnd" class="hidden"></div>
  <div id="dialog" class="hidden"></div>
  <div id="vcursor"><svg viewBox="0 0 18 18"><path d="M2 1l13 7.5-6 1.3-2.6 6z" fill="#fff" stroke="#000" stroke-width="1"/></svg></div>
  <div id="toast"></div>

  <div id="loading">
    <div class="logo"><span class="l1">Counter-Strife</span><span class="l2"><span class="two">2</span></span><small>Tactical shooter</small></div>
    <div id="loadbar"><i></i></div>
    <div id="loadtxt">Starting</div>
  </div>
</div>
